<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vremenska prognoza</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
<div class="container">
<a class="navbar-brand fw-semibold" href="#">Prognoza</a>
<div class="ms-auto">
<div class="form-check form-switch text-white">
<input class="form-check-input" type="checkbox" id="unitToggle">
<label class="form-check-label" for="unitToggle" id="unitLabel">°C</label>
</div>
</div>
</div>
</nav>
<main class="container py-4">
<!-- Form -->
<section class="card shadow-sm mb-4">
<div class="card-body">
<form id="searchForm" class="row g-3">
<div class="col-md-8">
<label for="cityInput" class="form-label">Grad</label>
<input type="text" id="cityInput" class="form-control" placeholder="npr. Sarajevo" required>
<div class="invalid-feedback">Unesi naziv grada (min. 2 slova).</div>
</div>
<div class="col-md-4 d-flex align-items-end">
<button class="btn btn-primary w-100" type="submit">Prikaži prognozu</button>
</div>
</form>
<div id="status" class="mt-3"></div>
</div>
</section>
<!-- Current weather -->
<section id="currentSection" class="d-none">
<div class="card shadow-sm mb-4">
<div class="card-body">
<div class="d-flex justify-content-between align-items-center mb-2">
<h5 class="card-title mb-0" id="cityTitle"></h5>
<small class="text-muted" id="updatedAt"></small>
</div>
<div class="row align-items-center">
<div class="col-md-6">
<h1 class="display-6" id="tempNow"></h1>
<p class="mb-1" id="descNow"></p>
<p class="mb-0"><span id="minMax"></span></p>
</div>
<div class="col-md-6">
<div class="row text-center">
<div class="col-6 col-md-3"><div class="stat"><div class="stat-label">Vlažnost</div><div id="humidity" class="stat-value"></div></div></div>
<div class="col-6 col-md-3"><div class="stat"><div class="stat-label">Vjetar</div><div id="wind" class="stat-value"></div></div></div>
<div class="col-6 col-md-3 mt-3 mt-md-0"><div class="stat"><div class="stat-label">Pritisak</div><div id="pressure" class="stat-value"></div></div></div>
<div class="col-6 col-md-3 mt-3 mt-md-0"><div class="stat"><div class="stat-label">Osjećaj</div><div id="feelsLike" class="stat-value"></div></div></div>
</div>
</div>
</div>
</div>
</div>
</section>
<!-- 5-day / 3-hour forecast -->
<section id="forecastSection" class="d-none">
<h5 class="mb-3">Sljedećih 5 dana</h5>
<div id="forecastGrid" class="row g-3"></div>
</section>
</main>
<footer class="py-4 text-center text-muted small">
   Napomena: Podaci preuzeti sa OpenWeatherMap.
</footer>
<script src="app.js"></script>
</body>
</html>
